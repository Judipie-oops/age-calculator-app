<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Age calculator app</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script src="./js/apps.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="window">
    <div id="top">
      <div>
        <p>DAY</p>
        <input type="text" placeholder="DD" id="dayInput" maxlength="2" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <h3 id="dayError" class="error"></h3>
      </div>

      <div>
        <p>MONTH</p>
        <input type="text" placeholder="MM" id="monthInput" maxlength="2" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <h3 id="monthError" class="error"></h3>
      </div>

      <div>
        <p>YEAR</p>
        <input type="text" placeholder="YYYY" id="yearInput" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        <h3 id="yearError" class="error"></h3>
      </div>
    </div>

    <div id="middle"><hr><img src="/assets/images/icon-arrow.svg" alt="Calculate" id="button"></div>

    <div id="bottom">
      <div><h2 id="yearOutput">--</h2><h1>&nbsp;years</h1></div>
      <div><h2 id="monthOutput">--</h2><h1>&nbsp;months</h1></div>
      <div><h2 id="dayOutput">--</h2><h1>&nbsp;days</h1></div>
    </div>
  </div>

  <div class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Jude Hakes</a>.</p>
  </div>
</body>
</html>
